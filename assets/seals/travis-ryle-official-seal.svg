<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="150" cy="150" r="145" fill="#1a3a52" stroke="#d4af37" stroke-width="5"/>
  
  <!-- Inner decorative circle -->
  <circle cx="150" cy="150" r="135" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Center emblem circle -->
  <circle cx="150" cy="150" r="90" fill="#2c5f7f" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Bank/Trust symbol - scales of justice -->
  <g transform="translate(150, 140)">
    <!-- Central pillar -->
    <rect x="-3" y="-30" width="6" height="60" fill="#d4af37"/>
    <!-- Base -->
    <rect x="-20" y="28" width="40" height="6" fill="#d4af37"/>
    <!-- Top bar -->
    <line x1="-35" y1="-30" x2="35" y2="-30" stroke="#d4af37" stroke-width="3"/>
    <!-- Left scale -->
    <line x1="-35" y1="-30" x2="-35" y2="-20" stroke="#d4af37" stroke-width="2"/>
    <rect x="-45" y="-20" width="20" height="3" fill="#d4af37"/>
    <!-- Right scale -->
    <line x1="35" y1="-30" x2="35" y2="-20" stroke="#d4af37" stroke-width="2"/>
    <rect x="25" y="-20" width="20" height="3" fill="#d4af37"/>
  </g>
  
  <!-- Stars for decoration -->
  <text x="150" y="75" font-family="Arial, sans-serif" font-size="24" fill="#d4af37" text-anchor="middle">★</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="18" fill="#d4af37" text-anchor="middle">★</text>
  <text x="220" y="150" font-family="Arial, sans-serif" font-size="18" fill="#d4af37" text-anchor="middle">★</text>
  
  <!-- Outer text - top -->
  <path id="topArc" d="M 40,150 A 110,110 0 0,1 260,150" fill="none"/>
  <text font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#d4af37" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      THE TRAVIS RYLE PRIVATE BANK
    </textPath>
  </text>
  
  <!-- Outer text - bottom -->
  <path id="bottomArc" d="M 260,150 A 110,110 0 0,1 40,150" fill="none"/>
  <text font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#d4af37" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ESTATE &amp; TRUST
    </textPath>
  </text>
  
  <!-- Center year -->
  <text x="150" y="215" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#d4af37" text-anchor="middle">EST. 2026</text>
</svg>
