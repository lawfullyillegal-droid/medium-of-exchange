<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="150" cy="150" r="145" fill="#1a1a2e" stroke="#c41e3a" stroke-width="5"/>
  
  <!-- Inner decorative circle -->
  <circle cx="150" cy="150" r="135" fill="none" stroke="#c41e3a" stroke-width="2"/>
  
  <!-- Center emblem circle -->
  <circle cx="150" cy="150" r="90" fill="#2e2e3e" stroke="#c41e3a" stroke-width="3"/>
  
  <!-- Shield/Badge symbol for enforcement -->
  <g transform="translate(150, 145)">
    <!-- Shield outline -->
    <path d="M 0,-45 L 25,-35 L 30,0 L 25,35 L 0,45 L -25,35 L -30,0 L -25,-35 Z" 
          fill="none" stroke="#c41e3a" stroke-width="3"/>
    <!-- Inner shield -->
    <path d="M 0,-40 L 20,-32 L 24,0 L 20,32 L 0,40 L -20,32 L -24,0 L -20,-32 Z" 
          fill="#c41e3a" opacity="0.3"/>
    <!-- Gavel symbol -->
    <rect x="-3" y="-15" width="6" height="30" fill="#c41e3a"/>
    <rect x="-12" y="-20" width="24" height="8" fill="#c41e3a" rx="2"/>
  </g>
  
  <!-- Stars for decoration -->
  <text x="150" y="70" font-family="Arial, sans-serif" font-size="24" fill="#c41e3a" text-anchor="middle">★</text>
  <text x="75" y="150" font-family="Arial, sans-serif" font-size="18" fill="#c41e3a" text-anchor="middle">★</text>
  <text x="225" y="150" font-family="Arial, sans-serif" font-size="18" fill="#c41e3a" text-anchor="middle">★</text>
  
  <!-- Outer text - top arc -->
  <path id="topArc" d="M 30,150 A 120,120 0 0,1 270,150" fill="none"/>
  <text font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#c41e3a" letter-spacing="1">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      LAWFULLY ILLEGAL PUBLIC
    </textPath>
  </text>
  
  <!-- Outer text - bottom arc -->
  <path id="bottomArc" d="M 270,150 A 120,120 0 0,1 30,150" fill="none"/>
  <text font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#c41e3a" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ACCOUNTABILITY ENFORCEMENT AGENCY
    </textPath>
  </text>
  
  <!-- Center text -->
  <text x="150" y="220" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#c41e3a" text-anchor="middle">OFFICIAL SEAL</text>
</svg>
